<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="https://www.ogol.com.br//img/logos/edicoes/176026_imgbank_.png" type="image/x-icon">
    <link rel="stylesheet" href="/src/pages/cadastrarJogadores/index.css">
    <link rel="stylesheet" href="../../../src/styles/base.css">
    <link rel="stylesheet" href="../../../src/styles/theme.css">
    <link 
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer" 
    />
    <title>Cadastrar Jogadores</title>
</head>
<body>
    <a href="../../../index.html" class="voltarBtn"><i class="fa-solid fa-arrow-left"></i></a>

    <div class="container">
        <main id="mainPutJogador">
            <input id="nomeJogador" type="text" placeholder="Nome" required>
            <input id="camisaJogador" type="number" placeholder="Número camisa" required>
            <input id="golsJogador" type="number" placeholder="Número Gols" required>

            <select id="posicaoSelect">
                <option value="Atacante">Atacante</option>
                <option value="Meio-campista">Meio-campista</option>
                <option value="Volante">Volante</option>
                <option value="Lateral-esquerdo">Lateral-esquerdo</option>
                <option value="Lateral-direito">Lateral-direito</option>
                <option value="Zagueiro">Zagueiro</option>
                <option value="Goleiro">Goleiro</option>
            </select>

            <select id="selecoesSelect"></select>
            
            <div class="boxTitular">
                <label for="">Titular:</label>
                <div class="divTitular">
                    <span>
                        <label for="">Sim</label>
                        <input type="radio" name="titular" id="simTitular">
                    </span>
                    <span>
                        <label for="">Não</label>
                        <input type="radio" name="titular" id="naoTitular">
                    </span>
                </div>
            </div>
            
            <button id="btnCadsJogador">Cadastrar</button>
        </main>
    </div>

    <script src="/src/pages/cadastrarJogadores/index.js" type="module"></script>
</body>
</html>
