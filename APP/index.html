<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <link rel="shortcut icon" href="/Favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>API - Copa do Mundo</title>
</head>
<body>
    <div class="card"></div>

    <h1 class="titulo">COPA DO MUNDO 2026</h1>

    <div class="boxIpt">
        <div class="divIpt">
            <i class="fa-solid fa-futbol"></i>
            <input type="text" class="ipt" placeholder="Insira o nome da seleção">
            <i class="fa-solid fa-futbol"></i>
        </div>
        <button class="btn">Requisitar</button>
    </div>

    <div class="boxSelecao">

        <div class="info1">
            <h1 class="nome"></h1>
            <img class="logo" src="" alt="">
            <h1 class="grupo"></h1>
            <h1 class="tecnico"></h1>
        </div>
        
        <div class="info2">
            <div class="boxInfos">
                <p class="numTitulos">Titúlos</p>
                <table class="tbConquistas">
                    <tr>
                        <th>ANO</th>
                        <th>PAÍS</th>
                    </tr>
                </table>
            </div>
            
            <div class="boxInfos">
                <p class="numJogadores">Jogadores</p>
                <table class="tbJogadores">
                    <tr>
                        <th>NOME</th>
                        <th>POSIÇÃO</th>
                        <th>CAMISA</th>
                    </tr>
                </table>
            </div>
        </div>

    </div>

    <script src="/scripts.js"></script>
</body>
</html>
