<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <link rel="shortcut icon" href="/Favicon.png" type="image/x-icon">
    <title>API - Copa do Mundo</title>
</head>
<body>
    <h1 class="titulo">COPA DO MUNDO 2026</h1>

    <div class="boxIpt">
        <input type="number" class="ipt">
        <button class="btn">Requisitar</button>
    </div>

    <div class="boxSelecao">

        <div class="info1">
            <h1 class="nome"></h1>
            <img class="logo" src="" alt="">
            <h1 class="grupo"></h1>
            <h1 class="tecnico"></h1>
        </div>
        
        <div class="info2">
            <div class="boxInfos">
                <p class="numTitulos">Titúlos</p>
                <table class="tbConquistas">
                    <tr>
                        <th>ANO</th>
                        <th>PAÍS</th>
                    </tr>
                </table>
            </div>
            
            <div class="boxInfos">
                <p class="numJogadores">Jogadores</p>
                <table class="tbJogadores">
                    <tr>
                        <th>NOME</th>
                        <th>POSIÇÃO</th>
                        <th>CAMISA</th>
                    </tr>
                </table>
            </div>
        </div>

    </div>

    <script src="/scripts.js"></script>
</body>
</html>
